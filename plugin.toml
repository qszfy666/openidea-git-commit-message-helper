id = "qszfy666.commit-message-helper"
name = "Git Commit Message Helper"
version = "0.8.0"
description = "Generate a Conventional Commits message for the changes selected in OpenIDEA's native Commit panel, with an LLM."
authors = ["qszfy666"]
license = "Apache-2.0"
icon = "icons/icon.svg"
icon-dark = "icons/icon_dark.svg"
change-notes = "0.8.0 — manual structured editor tool window and per-action button visibility; free-text commit language, field normalization, sentence bullets and a local quality check; per-project editor drafts; the compatibility cache now remembers what an endpoint refused; Japanese and Korean text. Needs OpenIDEA 0.1.40 (plugin API 1.4); new capabilities: storage, events."
categories = ["vcs", "ai"]
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"
# Sets the four button context keys at start-up, so a hidden button is
# hidden from the first frame instead of after the first command.
activation = ["on-startup-finished"]

[capabilities]
# The commit workflow: pending_commit reads the included changes and
# set_commit_message writes the draft message; the API key is a plugin secret
# and is filled in by the IDE when host::fetch sends a request.
required = ["vcs.read", "vcs.write", "secrets", "storage", "events"]
# Grant only the endpoints you use. `127.0.0.1` covers Magpie and local
# OpenAI-compatible servers; `localhost` covers Ollama-on-localhost.
# `clipboard` is optional: the model list copies the chosen id so it can be
# pasted into the Model setting, which the plugin cannot write itself.
optional = [
  "net:api.openai.com",
  "net:api.anthropic.com",
  "net:api.deepseek.com",
  "net:dashscope.aliyuncs.com",
  "net:api.moonshot.cn",
  "net:open.bigmodel.cn",
  "net:api.minimax.chat",
  "net:api.siliconflow.cn",
  "net:ark.cn-beijing.volces.com",
  "net:*.openai.azure.com",
  "net:openrouter.ai",
  "net:api.groq.com",
  "net:api.mistral.ai",
  "net:generativelanguage.googleapis.com",
  "net:127.0.0.1",
  "net:localhost",
  "clipboard",
]

[[contributes.commands]]
id = "generate"
title = "Generate Commit Message"
category = "Git Commit Message Helper"
when = "vcsAvailable"
icon = "icons/generate.svg"

[[contributes.commands]]
id = "generate-with-context"
title = "Generate Commit Message with Requirements"
category = "Git Commit Message Helper"
when = "vcsAvailable"
icon = "icons/generate-with-context.svg"

[[contributes.commands]]
id = "format"
title = "Format Commit Message"
category = "Git Commit Message Helper"
when = "vcsAvailable"
icon = "icons/format.svg"

# Brings the manual structured editor (the view below) to the front: the
# fourth button of the Commit panel.
[[contributes.commands]]
id = "manual"
title = "Edit Commit Message Fields"
category = "Git Commit Message Helper"
icon = "icons/manual.svg"
when = "vcsAvailable"

[[contributes.commands]]
id = "models"
title = "List LLM Models"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "endpoint"
title = "Show LLM Request URL"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "test"
title = "Test LLM Connection"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "template-preview"
title = "Preview Commit Template"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "template-help"
title = "Commit Template Variables"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "template-default"
title = "Restore Default Commit Template"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "thinking-levels"
title = "Show Available Thinking Levels"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "thinking-help"
title = "Thinking Parameter Mapping Help"
category = "Git Commit Message Helper"

# The buttons above the message field of both the Commit tool window and the
# Commit dialog.
[[contributes.menus]]
menu = "commit.message"
command = "generate"
when = "vcsAvailable && plugin.qszfy666.commit-message-helper.actionGenerate"

[[contributes.menus]]
menu = "commit.message"
command = "generate-with-context"
when = "vcsAvailable && plugin.qszfy666.commit-message-helper.actionGenerateWithContext"

[[contributes.menus]]
menu = "commit.message"
command = "format"
when = "vcsAvailable && plugin.qszfy666.commit-message-helper.actionFormat"

[[contributes.menus]]
menu = "commit.message"
command = "manual"
when = "vcsAvailable && plugin.qszfy666.commit-message-helper.actionManual"

# Keep a Tools-menu entry for discoverability and for running it with a keymap.
[[contributes.menus]]
menu = "tools"
command = "generate"

# The manual structured editor (checklist 3): a form of the seven commit
# fields. Applying renders them locally and writes into the Commit panel.
[[contributes.views]]
id = "commit-editor"
title = "Commit Message Editor"
icon = "icons/generate.svg"
location = "right"

[[contributes.keymaps]]
command = "generate"
key = "Ctrl+Alt+G"
mac = "Meta+Alt+G"

[contributes.settings]
title = "Git Commit Message Helper"

[[contributes.settings.pages]]
id = "commit"
title = "Commit"
schema = "settings/commit.json"

[[contributes.settings.pages]]
id = "prompts"
title = "Prompts"
schema = "settings/prompts.json"

[[contributes.settings.pages]]
id = "templates"
title = "Commit Templates"
schema = "settings/templates.json"

[[contributes.settings.pages.actions]]
title = "Preview"
command = "template-preview"

[[contributes.settings.pages.actions]]
title = "Variables"
command = "template-help"

[[contributes.settings.pages.actions]]
title = "Restore Default"
command = "template-default"

[[contributes.settings.pages]]
id = "llm"
title = "LLM Settings"
schema = "settings/llm.json"

[[contributes.settings.pages.actions]]
title = "Test"
command = "test"

[[contributes.settings.pages.actions]]
title = "Models"
command = "models"

[[contributes.settings.pages.actions]]
title = "Request URL"
command = "endpoint"

[[contributes.settings.pages.actions]]
title = "Thinking Levels"
command = "thinking-levels"

[[contributes.settings.pages.actions]]
title = "Thinking Help"
command = "thinking-help"

# Four fixed key slots: model profiles pick one of them. Secrets must be
# declared here, so a profile can only reference a slot listed in this manifest.
[[contributes.secrets]]
name = "api-key"
label = "LLM API key"
description = "Default key slot. Sent only to the endpoint you configure. Kept in the system keychain."

[[contributes.secrets]]
name = "api-key-2"
label = "LLM API key (slot 2)"
description = "Optional second key slot for a model profile. Kept in the system keychain."

[[contributes.secrets]]
name = "api-key-3"
label = "LLM API key (slot 3)"
description = "Optional third key slot for a model profile. Kept in the system keychain."

[[contributes.secrets]]
name = "api-key-4"
label = "LLM API key (slot 4)"
description = "Optional fourth key slot for a model profile. Kept in the system keychain."
