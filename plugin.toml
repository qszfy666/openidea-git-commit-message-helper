id = "qszfy666.commit-message-helper"
name = "Git Commit Message Helper"
version = "0.9.0"
description = "Generate a Conventional Commits message for the changes selected in OpenIDEA's native Commit panel, with an LLM."
authors = ["qszfy666"]
license = "Apache-2.0"
icon = "icons/icon.svg"
icon-dark = "icons/icon_dark.svg"
change-notes = "0.9.0 — simpler: the Commit panel keeps Generate and Generate with Requirements; the Format button, the field editor, model and prompt profiles, key slots 2–4 and the Models, Request URL, Thinking Levels and Thinking Help actions are removed, and saved profile values are no longer read. Needs OpenIDEA 0.1.41 (plugin API 1.5); new optional capability net:ask reaches an HTTPS endpoint outside the provider list once you allow that host."
categories = ["vcs", "ai"]
engines.openidea = "^1.5"
wasm = "dist/plugin.wasm"
# Sets the two button context keys at start-up, so a hidden button is
# hidden from the first frame instead of after the first command.
activation = ["on-startup-finished"]

[capabilities]
# The commit workflow: pending_commit reads the included changes and
# set_commit_message writes the draft message; the API key is a plugin secret
# and is filled in by the IDE when host::fetch sends a request.
required = ["vcs.read", "vcs.write", "secrets", "storage", "events"]
# Grant only the endpoints you use. `127.0.0.1` covers Magpie and local
# OpenAI-compatible servers; `localhost` covers Ollama-on-localhost.
# `net:ask` (API 1.5) covers a Base URL on any other HTTPS host: the IDE asks
# the first time a command connects to it, and the user allows or refuses
# that one host.
# `clipboard` is optional: Restore Default copies the built-in commit template
# so it can be pasted into the Templates setting.
optional = [
  "net:api.openai.com",
  "net:api.anthropic.com",
  "net:api.deepseek.com",
  "net:dashscope.aliyuncs.com",
  "net:api.moonshot.cn",
  "net:open.bigmodel.cn",
  "net:api.minimax.chat",
  "net:api.siliconflow.cn",
  "net:ark.cn-beijing.volces.com",
  "net:*.openai.azure.com",
  "net:openrouter.ai",
  "net:api.groq.com",
  "net:api.mistral.ai",
  "net:generativelanguage.googleapis.com",
  "net:127.0.0.1",
  "net:localhost",
  "net:ask",
  "clipboard",
]

[[contributes.commands]]
id = "generate"
title = "Generate Commit Message"
category = "Git Commit Message Helper"
when = "vcsAvailable"
icon = "diff-magic"

[[contributes.commands]]
id = "generate-with-context"
title = "Generate Commit Message with Requirements"
category = "Git Commit Message Helper"
when = "vcsAvailable"
icon = "review-comment"

[[contributes.commands]]
id = "test"
title = "Test LLM Connection"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "template-help"
title = "Commit Template Variables"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "template-default"
title = "Restore Default Commit Template"
category = "Git Commit Message Helper"

# The buttons above the message field of both the Commit tool window and the
# Commit dialog.
[[contributes.menus]]
menu = "commit.message"
command = "generate"
when = "vcsAvailable && plugin.qszfy666.commit-message-helper.actionGenerate"

[[contributes.menus]]
menu = "commit.message"
command = "generate-with-context"
when = "vcsAvailable && plugin.qszfy666.commit-message-helper.actionGenerateWithContext"

# Keep a Tools-menu entry for discoverability and for running it with a keymap.
[[contributes.menus]]
menu = "tools"
command = "generate"

[[contributes.keymaps]]
command = "generate"
key = "Ctrl+Alt+G"
mac = "Meta+Alt+G"

[contributes.settings]
title = "Git Commit Message Helper"

[[contributes.settings.pages]]
id = "commit"
title = "Commit"
schema = "settings/commit.json"

[[contributes.settings.pages]]
id = "prompts"
title = "Prompts"
schema = "settings/prompts.json"

[[contributes.settings.pages]]
id = "templates"
title = "Commit Templates"
schema = "settings/templates.json"

[[contributes.settings.pages.actions]]
title = "Variables"
command = "template-help"

[[contributes.settings.pages.actions]]
title = "Restore Default"
command = "template-default"

[[contributes.settings.pages]]
id = "llm"
title = "LLM Settings"
schema = "settings/llm.json"

[[contributes.settings.pages.actions]]
title = "Test"
command = "test"

# The API key every request carries; kept in the system keychain.
[[contributes.secrets]]
name = "api-key"
label = "LLM API key"
description = "Sent only to the endpoint you configure. Kept in the system keychain."

