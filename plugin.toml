id = "qszfy666.commit-message-helper"
name = "Git Commit Message Helper"
version = "0.6.0"
description = "Generate a Conventional Commits message for the changes selected in OpenIDEA's native Commit panel, with an LLM."
authors = ["qszfy666"]
license = "Apache-2.0"
icon = "icons/icon.svg"
icon-dark = "icons/icon_dark.svg"
change-notes = "0.6.0 — the commit message toolbar gains \"Generate with Requirements\" and \"Format Draft\"; the last commits of the repository are read as a style reference; a model that rejects `max_tokens` or `temperature` is retried without that parameter, and the result reports what was sent; the LLM Settings page lists the endpoint's models and previews the request URL. Needs OpenIDEA 0.1.40 (plugin API 1.4)."
categories = ["vcs", "ai"]
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"

[capabilities]
# The commit workflow: pending_commit reads the included changes and
# set_commit_message writes the draft message; the API key is a plugin secret
# and is filled in by the IDE when host::fetch sends a request.
required = ["vcs.read", "vcs.write", "secrets"]
# Grant only the endpoints you use. `127.0.0.1` covers Magpie and local
# OpenAI-compatible servers; `localhost` covers Ollama-on-localhost.
# `clipboard` is optional: the model list copies the chosen id so it can be
# pasted into the Model setting, which the plugin cannot write itself.
optional = [
  "net:api.openai.com",
  "net:api.anthropic.com",
  "net:api.deepseek.com",
  "net:dashscope.aliyuncs.com",
  "net:api.moonshot.cn",
  "net:open.bigmodel.cn",
  "net:api.minimax.chat",
  "net:api.siliconflow.cn",
  "net:ark.cn-beijing.volces.com",
  "net:*.openai.azure.com",
  "net:openrouter.ai",
  "net:api.groq.com",
  "net:api.mistral.ai",
  "net:generativelanguage.googleapis.com",
  "net:127.0.0.1",
  "net:localhost",
  "clipboard",
]

[[contributes.commands]]
id = "generate"
title = "Generate Commit Message"
category = "Git Commit Message Helper"
when = "vcsAvailable"

[[contributes.commands]]
id = "generate-with-context"
title = "Generate Commit Message with Requirements"
category = "Git Commit Message Helper"
when = "vcsAvailable"
icon = "icons/generate-with-context.svg"

[[contributes.commands]]
id = "format"
title = "Format Commit Message"
category = "Git Commit Message Helper"
when = "vcsAvailable"
icon = "icons/format.svg"

[[contributes.commands]]
id = "models"
title = "List LLM Models"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "endpoint"
title = "Show LLM Request URL"
category = "Git Commit Message Helper"

[[contributes.commands]]
id = "test"
title = "Test LLM Connection"
category = "Git Commit Message Helper"

# The buttons above the message field of both the Commit tool window and the
# Commit dialog.
[[contributes.menus]]
menu = "commit.message"
command = "generate"

[[contributes.menus]]
menu = "commit.message"
command = "generate-with-context"

[[contributes.menus]]
menu = "commit.message"
command = "format"

# Keep a Tools-menu entry for discoverability and for running it with a keymap.
[[contributes.menus]]
menu = "tools"
command = "generate"

[[contributes.keymaps]]
command = "generate"
key = "Ctrl+Alt+G"
mac = "Meta+Alt+G"

[contributes.settings]
title = "Git Commit Message Helper"

[[contributes.settings.pages]]
id = "commit"
title = "Commit"
schema = "settings/commit.json"

[[contributes.settings.pages]]
id = "prompts"
title = "Prompts"
schema = "settings/prompts.json"

[[contributes.settings.pages]]
id = "llm"
title = "LLM Settings"
schema = "settings/llm.json"

[[contributes.settings.pages.actions]]
title = "Test"
command = "test"

[[contributes.settings.pages.actions]]
title = "Models"
command = "models"

[[contributes.settings.pages.actions]]
title = "Request URL"
command = "endpoint"

[[contributes.secrets]]
name = "api-key"
label = "LLM API key"
description = "Sent only to the endpoint you configure. Kept in the system keychain."
