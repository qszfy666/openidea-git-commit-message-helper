[package]
name = "openidea-plugin-commit-message-helper"
version = "0.7.1"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The guest SDK at the plugin API this plugin targets (1.4, shipped in OpenIDEA 0.1.40).
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.40" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
